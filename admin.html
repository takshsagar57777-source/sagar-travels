<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sagar Travels - Admin</title>
  
<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f9;
  color:#222;
}

.login-box{
  max-width:420px;
  margin:80px auto;
  background:white;
  padding:30px;
  border-radius:16px;
  box-shadow:0 5px 25px rgba(0,0,0,.12);
}

h1{
  margin-top:0;
  text-align:center;
}

input, select{
  width:100%;
  padding:13px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:15px;
}

button{
  padding:12px 16px;
  border:0;
  border-radius:8px;
  background:#111827;
  color:white;
  font-size:15px;
  cursor:pointer;
}

.login-button{
  width:100%;
  margin-top:10px;
}

.error{
  color:red;
  text-align:center;
  margin-top:12px;
}

#dashboard{
  display:none;
}

.header{
  background:#111827;
  color:white;
  padding:20px;
}

.header h1{
  text-align:left;
  margin:0;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:25px 15px;
}

.search-box{
  background:white;
  padding:18px;
  border-radius:14px;
  margin-bottom:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.card{
  background:white;
  padding:20px;
  margin-bottom:15px;
  border-radius:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.card h3{
  margin-top:0;
}

.status{
  display:inline-block;
  padding:6px 10px;
  border-radius:20px;
  font-size:13px;
}

.status-new{
  background:#e5e7eb;
}

.status-contacted{
  background:#fef3c7;
}

.status-confirmed{
  background:#dcfce7;
}

.status-cancelled{
  background:#fee2e2;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:15px;
}

.call{
  display:inline-block;
  padding:10px 14px;
  background:#16a34a;
  color:white;
  text-decoration:none;
  border-radius:7px;
}

.whatsapp{
  display:inline-block;
  padding:10px 14px;
  background:#25D366;
  color:white;
  text-decoration:none;
  border-radius:7px;
}

.save{
  background:#2563eb;
}

.logout{
  width:auto;
  float:right;
  padding:8px 15px;
  margin:0;
  background:#dc2626;
}

.no-results{
  text-align:center;
  color:#666;
  padding:30px;
}

</style>

</head>

<body>


<!-- LOGIN -->

<div id="loginPage" class="login-box">

  <h1>Sagar Travels</h1>

  <p style="text-align:center;color:#666;">
    Admin Login
  </p>

  <input
    type="email"
    id="adminEmail"
    placeholder="Admin Email"
  >

  <input
    type="password"
    id="adminPassword"
    placeholder="Password"
  >

  <button
    class="login-button"
    onclick="adminLogin()">
    Login
  </button>

  <div id="loginError" class="error"></div>

</div>


<!-- DASHBOARD -->

<div id="dashboard">

  <div class="header">

    <button
      class="logout"
      onclick="logout()">
      Logout
    </button>

    <h1>Sagar Travels Admin Dashboard</h1>

    <p>
      Bus Hire Enquiries
    </p>

  </div>


  <div class="container">
    <!-- DASHBOARD SUMMARY -->

<div id="summaryCards" style="
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:15px;
  margin-bottom:20px;
">

  <div style="background:white;padding:20px;border-radius:14px;text-align:center;box-shadow:0 3px 12px rgba(0,0,0,.08);">
    <h2 id="totalCount">0</h2>
    <p>Total Enquiries</p>
  </div>

  <div style="background:white;padding:20px;border-radius:14px;text-align:center;box-shadow:0 3px 12px rgba(0,0,0,.08);">
    <h2 id="newCount">0</h2>
    <p>New</p>
  </div>

  <div style="background:white;padding:20px;border-radius:14px;text-align:center;box-shadow:0 3px 12px rgba(0,0,0,.08);">
    <h2 id="contactedCount">0</h2>
    <p>Contacted</p>
  </div>

  <div style="background:white;padding:20px;border-radius:14px;text-align:center;box-shadow:0 3px 12px rgba(0,0,0,.08);">
    <h2 id="confirmedCount">0</h2>
    <p>Confirmed</p>
  </div>

  <div style="background:white;padding:20px;border-radius:14px;text-align:center;box-shadow:0 3px 12px rgba(0,0,0,.08);">
    <h2 id="cancelledCount">0</h2>
    <p>Cancelled</p>
  </div>

</div>


    <!-- SEARCH -->

    <div class="search-box">

      <input
        type="text"
        id="searchInput"
        placeholder="Search by name or phone..."
        oninput="filterEnquiries()"
      >

    </div>


    <!-- ENQUIRIES -->

    <div id="enquiries">
      Loading enquiries...
    </div>


  </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>


const SUPABASE_URL =
"https://lyyrajvxhumbqplqelei.supabase.co";


const SUPABASE_KEY =
"sb_publishable_38vwqEeCbiQ9D8fLH2n4gA_T7Qy7L_b";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let allEnquiries = [];


// LOGIN

async function adminLogin(){

  const email =
    document.getElementById("adminEmail").value.trim();

  const password =
    document.getElementById("adminPassword").value;


  if(!email || !password){

    document.getElementById("loginError").innerText =
      "Email aur password enter karo.";

    return;
  }


  const { data, error } =
    await supabaseClient.auth.signInWithPassword({

      email:email,
      password:password

    });


  if(error){

    console.error(error);

    document.getElementById("loginError").innerText =
      "Email ya password galat hai.";

    return;
  }


  document.getElementById("loginPage").style.display =
    "none";

  document.getElementById("dashboard").style.display =
    "block";


  loadEnquiries();
  function updateSummary(){

  const total =
    allEnquiries.length;

  const newCount =
    allEnquiries.filter(item =>
      !item.status || item.status === "new"
    ).length;

  const contacted =
    allEnquiries.filter(item =>
      item.status === "contacted"
    ).length;

  const confirmed =
    allEnquiries.filter(item =>
      item.status === "confirmed"
    ).length;

  const cancelled =
    allEnquiries.filter(item =>
      item.status === "cancelled"
    ).length;


  document.getElementById("totalCount").innerText =
    total;

  document.getElementById("newCount").innerText =
    newCount;

  document.getElementById("contactedCount").innerText =
    contacted;

  document.getElementById("confirmedCount").innerText =
    confirmed;

  document.getElementById("cancelledCount").innerText =
    cancelled;
}

}


// LOAD ENQUIRIES
async function loadEnquiries(){

  const box = document.getElementById("enquiries");

  box.innerHTML = "Loading enquiries...";

  const { data, error } = await supabaseClient
    .from("hire_enquiries")
    .select("*")
    .order("created_at", {
      ascending: false
    });

  if(error){

    console.error(error);

    box.innerHTML =
      "<p style='color:red;'>Enquiries load nahi ho rahi: " +
      error.message +
      "</p>";

    return;
  }

  allEnquiries = data || [];

  updateSummary();

  displayEnquiries(allEnquiries);
}



// DISPLAY

function displayEnquiries(data){

  const box =
    document.getElementById("enquiries");


  if(!data || data.length === 0){

    box.innerHTML =
      "<div class='no-results'>No enquiries found.</div>";

    return;
  }


  box.innerHTML =
    data.map(item => {


      let statusClass =
        "status-new";


      if(item.status === "contacted"){
        statusClass = "status-contacted";
      }

      if(item.status === "confirmed"){
        statusClass = "status-confirmed";
      }

      if(item.status === "cancelled"){
        statusClass = "status-cancelled";
      }


      const phone =
        String(item.phone || "")
          .replace(/\D/g,"");


      const whatsappNumber =
        phone.length === 10
          ? "91" + phone
          : phone;


      return `

      <div class="card">

        <h3>
          ${escapeHtml(item.name || "Customer")}
        </h3>


        <p>
          <b>Phone:</b>
          ${escapeHtml(item.phone || "")}
        </p>


        <p>
          <b>Route:</b>
          ${escapeHtml(item.pickup || "")}
          →
          ${escapeHtml(item.destination || "")}
        </p>


        <p>
          <b>Travel Date:</b>
          ${escapeHtml(item.hire_date || "Not provided")}
        </p>


        <p>
          <b>Bus Type:</b>
          ${escapeHtml(item.bus_type || "Not provided")}
        </p>


        <p>
          <b>Purpose:</b>
          ${escapeHtml(item.purpose || "Not provided")}
        </p>


        <p>
          <b>Status:</b>

          <span class="status ${statusClass}">
            ${escapeHtml(item.status || "new")}
          </span>

        </p>


        <select id="status-${item.id}">

          <option value="new"
            ${item.status === "new" || !item.status ? "selected" : ""}>
            New
          </option>

          <option value="contacted"
            ${item.status === "contacted" ? "selected" : ""}>
            Contacted
          </option>

          <option value="confirmed"
            ${item.status === "confirmed" ? "selected" : ""}>
            Confirmed
          </option>

          <option value="cancelled"
            ${item.status === "cancelled" ? "selected" : ""}>
            Cancelled
          </option>

        </select>


        <div class="actions">

          <a
            class="call"
            href="tel:${escapeHtml(item.phone || "")}">
            📞 Call
          </a>


          <a
            class="whatsapp"
            href="https://wa.me/${whatsappNumber}"
            target="_blank">
            💬 WhatsApp
          </a>


          <button
            class="save"
            onclick="updateStatus(${item.id})">
            🔄 Save Status
          </button>

        </div>

      </div>

      `;

    }).join("");

}


// SEARCH

function filterEnquiries(){

  const search =
    document.getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();


  if(!search){

    displayEnquiries(allEnquiries);

    return;
  }


  const filtered =
    allEnquiries.filter(item =>

      String(item.name || "")
        .toLowerCase()
        .includes(search)

      ||

      String(item.phone || "")
        .toLowerCase()
        .includes(search)

    );


  displayEnquiries(filtered);

}


// UPDATE STATUS

async function updateStatus(id){

  const select =
    document.getElementById(
      "status-" + id
    );


  const newStatus =
    select.value;


  const { error } =
    await supabaseClient
      .from("hire_enquiries")
      .update({
        status:newStatus
      })
      .eq("id",id);


  if(error){

    console.error(error);

    alert(
      "Status update nahi hua."
    );

    return;
  }


  alert(
    "Status successfully update ho gaya."
  );


  loadEnquiries();

}


// HTML SECURITY

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


// LOGOUT

async function logout(){

  await supabaseClient.auth.signOut();


  document.getElementById("dashboard").style.display =
    "none";


  document.getElementById("loginPage").style.display =
    "block";


  document.getElementById("adminEmail").value =
    "";

  document.getElementById("adminPassword").value =
    "";

}

</script>

</body>
</html>
