<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sagar Travels - Admin</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f9;
  color:#222;
}

.login-box{
  max-width:420px;
  margin:80px auto;
  background:white;
  padding:30px;
  border-radius:16px;
  box-shadow:0 5px 25px rgba(0,0,0,.12);
}

.login-box h1{
  text-align:center;
  margin-top:0;
}

input,
select{
  width:100%;
  padding:13px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:15px;
}

button{
  padding:12px 16px;
  border:0;
  border-radius:8px;
  background:#111827;
  color:white;
  font-size:15px;
  cursor:pointer;
}

.login-button{
  width:100%;
  margin-top:10px;
}

.error{
  color:red;
  text-align:center;
  margin-top:12px;
}

#dashboard{
  display:none;
}

.header{
  background:#111827;
  color:white;
  padding:20px;
}

.header h1{
  margin:0;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px 15px;
}

.logout{
  float:right;
  background:#dc2626;
  padding:8px 15px;
}

.summary{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:15px;
  margin-bottom:20px;
}

.summary-card{
  background:white;
  padding:20px;
  border-radius:14px;
  text-align:center;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.summary-card h2{
  margin:0 0 8px;
  font-size:30px;
}

.summary-card p{
  margin:0;
  color:#666;
}

.search-box{
  background:white;
  padding:18px;
  border-radius:14px;
  margin-bottom:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.card{
  background:white;
  padding:20px;
  margin-bottom:15px;
  border-radius:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.card h3{
  margin-top:0;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:15px;
}

.call{
  display:inline-block;
  padding:10px 14px;
  background:#16a34a;
  color:white;
  text-decoration:none;
  border-radius:7px;
}

.whatsapp{
  display:inline-block;
  padding:10px 14px;
  background:#25D366;
  color:white;
  text-decoration:none;
  border-radius:7px;
}

.save{
  background:#2563eb;
}

.status{
  display:inline-block;
  padding:6px 10px;
  border-radius:20px;
  font-size:13px;
}

.status-new{
  background:#e5e7eb;
}

.status-contacted{
  background:#fef3c7;
}

.status-confirmed{
  background:#dcfce7;
}

.status-cancelled{
  background:#fee2e2;
}

.message{
  text-align:center;
  padding:30px;
  color:#666;
}

</style>

</head>


<body>


<!-- LOGIN -->

<div id="loginPage" class="login-box">

  <h1>Sagar Travels</h1>

  <p style="text-align:center;color:#666;">
    Admin Login
  </p>

  <input
    type="email"
    id="adminEmail"
    placeholder="Admin Email"
  >

  <input
    type="password"
    id="adminPassword"
    placeholder="Password"
  >

  <button
    class="login-button"
    onclick="adminLogin()">
    Login
  </button>

  <div id="loginError" class="error"></div>

</div>


<!-- DASHBOARD -->

<div id="dashboard">

  <div class="header">

    <button
      class="logout"
      onclick="logout()">
      Logout
    </button>

    <h1>Sagar Travels Admin Dashboard</h1>

    <p>Bus Hire Enquiries</p>

  </div>


  <div class="container">


    <!-- SUMMARY -->

    <div class="summary">

      <div class="summary-card">
        <h2 id="totalCount">0</h2>
        <p>Total Enquiries</p>
      </div>

      <div class="summary-card">
        <h2 id="newCount">0</h2>
        <p>New</p>
      </div>

      <div class="summary-card">
        <h2 id="contactedCount">0</h2>
        <p>Contacted</p>
      </div>

      <div class="summary-card">
        <h2 id="confirmedCount">0</h2>
        <p>Confirmed</p>
      </div>

      <div class="summary-card">
        <h2 id="cancelledCount">0</h2>
        <p>Cancelled</p>
      </div>

    </div>


    <!-- SEARCH -->

    <div class="search-box">

      <input
        type="text"
        id="searchInput"
        placeholder="Search by customer name or phone..."
        oninput="filterEnquiries()"
      >

    </div>


    <!-- ENQUIRIES -->

    <div id="enquiries">
      Loading enquiries...
    </div>


  </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>


/* SUPABASE CONNECTION */

const SUPABASE_URL =
"https://lyyrajvxhumbqplqelei.supabase.co";


const SUPABASE_KEY =
"YAHAN_APNI_PUBLISHABLE_KEY_PASTE_KARNA";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let allEnquiries = [];



/* LOGIN */

async function adminLogin(){

  const email =
    document.getElementById("adminEmail")
      .value
      .trim();

  const password =
    document.getElementById("adminPassword")
      .value;


  if(!email || !password){

    document.getElementById("loginError").innerText =
      "Email aur password enter karo.";

    return;
  }


  const { error } =
    await supabaseClient.auth.signInWithPassword({

      email:email,
      password:password

    });


  if(error){

    console.error(error);

    document.getElementById("loginError").innerText =
      "Email ya password galat hai.";

    return;
  }


  showDashboard();

}



/* SHOW DASHBOARD */

function showDashboard(){

  document.getElementById("loginPage").style.display =
    "none";

  document.getElementById("dashboard").style.display =
    "block";

  loadEnquiries();

}



/* LOAD ENQUIRIES */

async function loadEnquiries(){

  const box =
    document.getElementById("enquiries");


  box.innerHTML =
    "Loading enquiries...";


  const { data, error } =
    await supabaseClient
      .from("hire_enquiries")
      .select("*")
      .order("created_at", {
        ascending:false
      });


  if(error){

    console.error(error);

    box.innerHTML =
      "<div class='message'>" +
      "Enquiries load nahi ho rahi.<br><br>" +
      error.message +
      "</div>";

    return;
  }


  allEnquiries =
    data || [];


  updateSummary();


  displayEnquiries(
    allEnquiries
  );

}



/* SUMMARY */

function updateSummary(){

  const total =
    allEnquiries.length;


  const newCount =
    allEnquiries.filter(function(item){

      return !item.status ||
             item.status === "new";

    }).length;


  const contacted =
    allEnquiries.filter(function(item){

      return item.status === "contacted";

    }).length;


  const confirmed =
    allEnquiries.filter(function(item){

      return item.status === "confirmed";

    }).length;


  const cancelled =
    allEnquiries.filter(function(item){

      return item.status === "cancelled";

    }).length;


  document.getElementById("totalCount")
    .innerText = total;


  document.getElementById("newCount")
    .innerText = newCount;


  document.getElementById("contactedCount")
    .innerText = contacted;


  document.getElementById("confirmedCount")
    .innerText = confirmed;


  document.getElementById("cancelledCount")
    .innerText = cancelled;

}



/* DISPLAY ENQUIRIES */

function displayEnquiries(data){

  const box =
    document.getElementById("enquiries");


  if(!data || data.length === 0){

    box.innerHTML =
      "<div class='message'>" +
      "No enquiries found." +
      "</div>";

    return;
  }


  box.innerHTML =
    data.map(function(item){


      let status =
        item.status || "new";


      let statusClass =
        "status-new";


      if(status === "contacted"){
        statusClass =
          "status-contacted";
      }


      if(status === "confirmed"){
        statusClass =
          "status-confirmed";
      }


      if(status === "cancelled"){
        statusClass =
          "status-cancelled";
      }


      const phone =
        String(item.phone || "")
          .replace(/\D/g,"");


      const whatsappNumber =
        phone.length === 10
          ? "91" + phone
          : phone;


      return `

        <div class="card">

          <h3>
            ${escapeHtml(item.name || "Customer")}
          </h3>


          <p>
            <b>Phone:</b>
            ${escapeHtml(item.phone || "")}
          </p>


          <p>
            <b>Route:</b>
            ${escapeHtml(item.pickup || "")}
            →
            ${escapeHtml(item.destination || "")}
          </p>


          <p>
            <b>Travel Date:</b>
            ${escapeHtml(item.hire_date || "Not provided")}
          </p>


          <p>
            <b>Bus Type:</b>
            ${escapeHtml(item.bus_type || "Not provided")}
          </p>


          <p>
            <b>Purpose:</b>
            ${escapeHtml(item.purpose || "Not provided")}
          </p>


          <p>

            <b>Current Status:</b>

            <span class="status ${statusClass}">
              ${escapeHtml(status)}
            </span>

          </p>


          <select id="status-${item.id}">

            <option value="new"
              ${status === "new" ? "selected" : ""}>
              New
            </option>

            <option value="contacted"
              ${status === "contacted" ? "selected" : ""}>
              Contacted
            </option>

            <option value="confirmed"
              ${status === "confirmed" ? "selected" : ""}>
              Confirmed
            </option>

            <option value="cancelled"
              ${status === "cancelled" ? "selected" : ""}>
              Cancelled
            </option>

          </select>


          <div class="actions">


            <a
              class="call"
              href="tel:${escapeHtml(item.phone || "")}">
              📞 Call Customer
            </a>


            <a
              class="whatsapp"
              href="https://wa.me/${whatsappNumber}"
              target="_blank">
              💬 WhatsApp
            </a>


            <button
              class="save"
              onclick="updateStatus(${item.id})">
              🔄 Save Status
            </button>


          </div>


        </div>

      `;

    }).join("");

}



/* SEARCH */

function filterEnquiries(){

  const search =
    document.getElementById("searchInput")
      .value
      .toLowerCase()
      .trim();


  if(!search){

    displayEnquiries(
      allEnquiries
    );

    return;
  }


  const filtered =
    allEnquiries.filter(function(item){

      const name =
        String(item.name || "")
          .toLowerCase();


      const phone =
        String(item.phone || "")
          .toLowerCase();


      return name.includes(search) ||
             phone.includes(search);

    });


  displayEnquiries(
    filtered
  );

}



/* UPDATE STATUS */

async function updateStatus(id){

  const select =
    document.getElementById(
      "status-" + id
    );


  const newStatus =
    select.value;


  const { error } =
    await supabaseClient
      .from("hire_enquiries")
      .update({
        status:newStatus
      })
      .eq("id",id);


  if(error){

    console.error(error);

    alert(
      "Status update nahi hua: " +
      error.message
    );

    return;
  }


  alert(
    "Status successfully update ho gaya."
  );


  loadEnquiries();

}



/* ESCAPE HTML */

function escapeHtml(value){

  return String(value)

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}



/* LOGOUT */

async function logout(){

  await supabaseClient.auth.signOut();


  document.getElementById("dashboard").style.display =
    "none";


  document.getElementById("loginPage").style.display =
    "block";


  document.getElementById("adminEmail").value =
    "";


  document.getElementById("adminPassword").value =
    "";

}

</script>

</body>

</html>
