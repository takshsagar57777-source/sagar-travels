<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sagar Travels - Admin</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f9;
  color:#222;
}

.login-box{
  max-width:420px;
  margin:80px auto;
  background:white;
  padding:30px;
  border-radius:16px;
  box-shadow:0 5px 25px rgba(0,0,0,.12);
}

h1{
  margin-top:0;
  text-align:center;
}

input{
  width:100%;
  padding:13px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:15px;
}

button{
  width:100%;
  padding:13px;
  margin-top:10px;
  border:0;
  border-radius:8px;
  background:#111827;
  color:white;
  font-size:16px;
  cursor:pointer;
}

.error{
  color:red;
  text-align:center;
  margin-top:12px;
}

#dashboard{
  display:none;
}

.header{
  background:#111827;
  color:white;
  padding:20px;
}

.header h1{
  text-align:left;
  margin:0;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:25px 15px;
}

.card{
  background:white;
  padding:20px;
  margin-bottom:15px;
  border-radius:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.card h3{
  margin-top:0;
}

.status{
  display:inline-block;
  padding:6px 10px;
  background:#e5e7eb;
  border-radius:20px;
  font-size:13px;
}

.call{
  display:inline-block;
  margin-top:10px;
  padding:9px 14px;
  background:#16a34a;
  color:white;
  text-decoration:none;
  border-radius:7px;
}

.logout{
  width:auto;
  float:right;
  padding:8px 15px;
  margin:0;
  background:#dc2626;
}

</style>

</head>

<body>


<!-- LOGIN -->

<div id="loginPage" class="login-box">

  <h1>Sagar Travels</h1>

  <p style="text-align:center;color:#666;">
    Admin Login
  </p>

  <input
    type="email"
    id="adminEmail"
    placeholder="Admin Email"
  >

  <input
    type="password"
    id="adminPassword"
    placeholder="Password"
  >

  <button onclick="adminLogin()">
    Login
  </button>

  <div id="loginError" class="error"></div>

</div>


<!-- DASHBOARD -->

<div id="dashboard">

  <div class="header">

    <button class="logout" onclick="logout()">
      Logout
    </button>

    <h1>Sagar Travels Admin Dashboard</h1>

    <p>
      Bus Hire Enquiries
    </p>

  </div>

  <div class="container">

    <div id="enquiries">
      Loading enquiries...
    </div>

  </div>

</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://lyyrajvxhumbqplqelei.supabase.co";


const SUPABASE_KEY =
"sb_publishable_38vwqEeCbiQ9D8fLH2n4gA_T7Qy7L_b";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


// ADMIN LOGIN

async function adminLogin(){

  const email =
    document.getElementById("adminEmail").value.trim();

  const password =
    document.getElementById("adminPassword").value;


  if(!email || !password){

    document.getElementById("loginError").innerText =
      "Email aur password enter karo.";

    return;
  }


  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });


  if(error){

    console.error(error);

    document.getElementById("loginError").innerText =
      "Email ya password galat hai.";

    return;
  }


  document.getElementById("loginPage").style.display =
    "none";

  document.getElementById("dashboard").style.display =
    "block";


  loadEnquiries();

}


// LOAD ENQUIRIES

async function loadEnquiries(){

  const box =
    document.getElementById("enquiries");

  box.innerHTML =
    "Loading enquiries...";


  const { data, error } =
    await supabaseClient
      .from("hire_enquiries")
      .select("*")
      .order("created_at", {
        ascending:false
      });


  if(error){

    console.error(error);

    box.innerHTML =
      "<p style='color:red;'>Enquiries load nahi ho rahi.</p>";

    return;
  }


  if(!data || data.length === 0){

    box.innerHTML =
      "<p>No enquiries found.</p>";

    return;
  }


  box.innerHTML =
    data.map(item => `

      <div class="card">

        <h3>
          ${item.name}
        </h3>

        <p>
          <b>Phone:</b>
          ${item.phone}
        </p>

        <p>
          <b>Route:</b>
          ${item.pickup}
          →
          ${item.destination}
        </p>

        <p>
          <b>Travel Date:</b>
          ${item.hire_date || "Not provided"}
        </p>

        <p>
          <b>Bus Type:</b>
          ${item.bus_type || "Not provided"}
        </p>

        <p>
          <b>Purpose:</b>
          ${item.purpose || "Not provided"}
        </p>

        <p>
          <b>Status:</b>

          <span class="status">
            ${item.status || "new"}
          </span>

        </p>

        <a
          class="call"
          href="tel:${item.phone}"
        >
          Call Customer
        </a>

      </div>

    `).join("");

}


// LOGOUT

async function logout(){

  await supabaseClient.auth.signOut();

  document.getElementById("dashboard").style.display =
    "none";

  document.getElementById("loginPage").style.display =
    "block";

  document.getElementById("adminEmail").value = "";

  document.getElementById("adminPassword").value = "";

}

</script>

</body>
</html>
