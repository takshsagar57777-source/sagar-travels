<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sagar Travels</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f7fb;
  color:#1f2937;
}

header{
  background:#111827;
  color:white;
  padding:18px 7%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:25px;
  font-weight:bold;
}

nav a{
  color:white;
  text-decoration:none;
  margin-left:22px;
}

.hero{
  background:linear-gradient(135deg,#111827,#2563eb);
  color:white;
  text-align:center;
  padding:70px 7%;
}

.hero h1{
  font-size:44px;
  margin-bottom:12px;
}

.hero p{
  font-size:18px;
  margin-bottom:30px;
}

.search-box{
  background:white;
  max-width:950px;
  margin:auto;
  padding:22px;
  border-radius:14px;
  display:grid;
  grid-template-columns:1fr 1fr 1fr 160px;
  gap:12px;
}

input,select,button{
  width:100%;
  padding:14px;
  border-radius:8px;
  border:1px solid #ddd;
  font-size:15px;
}

button{
  background:#2563eb;
  color:white;
  border:none;
  font-weight:bold;
  cursor:pointer;
}

section{
  padding:55px 7%;
}

.section-title{
  text-align:center;
  margin-bottom:30px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
}

.card{
  background:white;
  padding:30px;
  border-radius:14px;
  text-align:center;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
}

.card h3{
  margin:15px 0 10px;
  font-size:21px;
}

.card p{
  color:#6b7280;
  line-height:1.6;
}

.icon{
  font-size:42px;
}

.hire{
  background:white;
}

.hire-box{
  max-width:850px;
  margin:auto;
  background:#f8fafc;
  padding:30px;
  border-radius:15px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-top:20px;
}

.full{
  grid-column:1 / -1;
}

.tours{
  background:#f5f7fb;
}

.tour-card{
  background:white;
  border-radius:14px;
  overflow:hidden;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
}

.tour-content{
  padding:22px;
}

.tour-content h3{
